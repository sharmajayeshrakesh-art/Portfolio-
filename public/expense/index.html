<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kharcha</title>
    <meta name="description" content="Share a payment screenshot, tap save. Offline expense tracking that stays on your phone." />

    <meta name="theme-color" content="#101418" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles/app.css" />
  </head>

  <body>
    <main id="screens">
      <section id="screen-today" class="screen" aria-label="Today"></section>
      <section id="screen-history" class="screen" aria-label="History" hidden></section>
      <section id="screen-add" class="screen" aria-label="Add a payment" hidden></section>
      <section id="screen-settings" class="screen" aria-label="Settings" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button class="tab" type="button" data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8" /></svg>
        <span>Today</span>
      </button>
      <button class="tab" type="button" data-tab="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 7.5V12l3 2" /></svg>
        <span>History</span>
      </button>
      <button class="tab" type="button" data-tab="add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span>Add</span>
      </button>
      <button class="tab" type="button" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /><circle cx="9" cy="7" r="2" /><circle cx="15" cy="17" r="2" /></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div id="sheet" class="sheet" hidden>
      <div id="sheet-scrim" class="sheet-scrim"></div>
      <div id="sheet-panel" class="sheet-panel" role="dialog" aria-modal="true" tabindex="-1"></div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <noscript>
      <p style="padding: 24px; color: #f2f4f6">Kharcha needs JavaScript — everything it does runs on your phone.</p>
    </noscript>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
