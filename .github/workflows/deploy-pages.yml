name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static export
        env:
          PAGES: "1"
          NEXT_PUBLIC_BASE_PATH: "/Portfolio-"
        run: npm run build
      - name: Build the single-file offline app
        # Published alongside the PWA so anyone can download one .html file and
        # run NeuroPlay with no server and no internet — the demo/USB copy.
        run: |
          npm run build:app
          cp dist/NeuroPlay.html out/neuroplay/NeuroPlay.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
